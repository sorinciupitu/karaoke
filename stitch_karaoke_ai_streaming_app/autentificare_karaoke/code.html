<script>
  (function() {
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const emailGlow = document.getElementById('emailGlow');
    const passwordGlow = document.getElementById('passwordGlow');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (emailInput && emailGlow) {
      emailInput.addEventListener('focus', () => emailGlow.classList.remove('opacity-0'));
      emailInput.addEventListener('blur', () => emailGlow.classList.add('opacity-0'));
    }

    if (passwordInput && passwordGlow) {
      passwordInput.addEventListener('focus', () => passwordGlow.classList.remove('opacity-0'));
      passwordInput.addEventListener('blur', () => passwordGlow.classList.add('opacity-0'));
    }

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        submitBtn.classList.add('scale-95');
        setTimeout(() => submitBtn.classList.remove('scale-95'), 140);
      });
    }
  })();
