services:
  app:
    build:
      context: ./backend
      args:
        TORCH: ${TORCH:-cpu}
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DATABASE_URL: sqlite:////data/karaoke.db
      MEDIA_DIR: /data/media
      MODELS_DIR: /models
      TORCH_HOME: /models
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_CPU_MODEL: ${WHISPER_CPU_MODEL:-medium}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ro}
      DEVICE: ${DEVICE:-auto}
      CUDA_MIN_FREE_GB: ${CUDA_MIN_FREE_GB:-4.0}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-auto}
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-/data/cookies.txt}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
      - models:/models
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${PORT:-7777}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data:
  models:
